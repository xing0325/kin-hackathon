name: Deploy KIN user demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "platform/kin-core/console/kin-webapp/**"
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build user demo
        working-directory: platform/kin-core/console/kin-webapp
        run: |
          npm ci
          npm test
          npm run build
          cp dist/index.html dist/404.html
        env:
          VITE_KIN_DEMO: "1"
          VITE_KIN_HASH_ROUTER: "1"
      - name: Build animated intro site
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run build -- --base=/kin-hackathon/brand/
      - name: Assemble Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/brand
          cp -R platform/kin-core/console/kin-webapp/dist/. pages-dist/
          cp -R apps/web/dist/. pages-dist/brand/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
