name: Deploy KIN user demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "platform/kin-core/console/kin-webapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/kin-core/console/kin-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/kin-core/console/kin-webapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_KIN_DEMO: "1"
          VITE_KIN_HASH_ROUTER: "1"
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/kin-core/console/kin-webapp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
